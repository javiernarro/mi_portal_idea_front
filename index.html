<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/tractor-tire.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi portal</title>
  <script>
    // Aplica el tema del usuario con sesion antes de pintar, para que no parpadee.
    // Sin sesion o sin preferencia guardada: claro (no se copia el tema del sistema).
    try {
      var e = JSON.parse(localStorage.getItem('empleado') || 'null');
      var id = e && e.data && e.data.id;
      if (id !== undefined && id !== null && localStorage.getItem('mi-portal-tema:' + id) === 'oscuro') {
        document.documentElement.classList.add('app-dark');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
